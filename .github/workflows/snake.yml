# Draws the contribution snake shown at the bottom of README.md and
# publishes the SVGs to the `output` branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Warm orange/gold to match assets/terminal.svg and natlee.github.io
          outputs: |
            dist/github-snake.svg?color_snake=#d4741e&color_dots=#ebedf0,#fed7aa,#fdba74,#f97316,#c2410c
            dist/github-snake-dark.svg?color_snake=#e6b800&color_dots=#161b22,#7c2d12,#c2410c,#ea580c,#fb923c

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
